[project]
name = "brainrot"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["brainrot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
